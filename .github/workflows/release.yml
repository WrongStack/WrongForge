name: release

# Tag a version (git tag v0.4.0 && git push --tags) → both platforms build a
# single-file executable and attach them to a GitHub Release. `wrongforge
# update` on a machine downloads exactly these assets (name pattern:
# wrongforge-<os>-<arch>[.exe] — keep scripts/build-binary.mjs in sync).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: macos-latest
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps (root + webui)
        run: |
          npm ci
          npm --prefix webui ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test
          npm run test:install
          npm --prefix webui run test

      - name: Build binary (webui + embed + bun compile)
        run: npm run build:binary
        env:
          BUN: bun

      - name: Verify native binary version
        run: |
          node -e "const cp = require('node:child_process'); const p = require('./package.json'); const os = process.platform === 'win32' ? 'windows' : process.platform === 'darwin' ? 'macos' : 'linux'; const bin = './release/wrongforge-' + os + '-' + process.arch + (process.platform === 'win32' ? '.exe' : ''); const out = cp.execFileSync(bin, ['version'], { encoding:'utf8' }); console.log(out); if (!out.includes('WrongForge ' + p.version + ' ')) process.exit(1);"

      # Apple Silicon runner also cross-compiles the Intel variant (the
      # embedded assets are already generated by build:binary above)
      - name: Cross-compile macOS x64
        if: matrix.platform == 'macos'
        run: bun build --compile --target=bun-macos-x64 --outfile release/wrongforge-macos-x64 src/main.ts

      - uses: actions/upload-artifact@v4
        with:
          name: wrongforge-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: sha256 (all platforms, one file)
        run: |
          cd release
          sha256sum wrongforge-* | tee SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
